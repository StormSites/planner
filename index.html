<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Clicker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --gold: #ffd700;
            --blue: #00d4ff;
            --purple: #6a0dad;
            --bg: #020205;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Login Overlay --- */
        #selection-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #1a1a2e 0%, #000 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .user-btn {
            background: transparent;
            border: 2px solid var(--gold);
            color: white;
            padding: 15px 40px;
            margin: 10px;
            font-size: 2rem;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.3s;
        }

        .user-btn:hover {
            background: var(--gold);
            color: black;
            box-shadow: 0 0 30px var(--gold);
        }

        /* --- Main Layout --- */
        #game-layout {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            height: 100vh;
            display: none;
        }

        /* Panels */
        .panel {
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
            overflow-y: auto;
        }

        .center-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: none;
        }

        /* --- Typography --- */
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; margin: 10px 0; }
        .stars-count { font-size: 3rem; color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        .log-text { font-size: 0.9rem; color: #aaa; margin: 4px 0; }
        .highlight { color: var(--blue); font-weight: bold; }

        /* --- The Star --- */
        #star-button {
            width: 300px;
            height: 300px;
            background: url('https://pngimg.com/uploads/star/star_PNG1591.png') center/contain no-repeat;
            border: none;
            cursor: pointer;
            transition: 0.1s;
            filter: drop-shadow(0 0 20px var(--gold));
        }

        #star-button:active { transform: scale(0.92); }

        /* --- Shop Items --- */
        .shop-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.2s;
        }

        .shop-item:hover { background: rgba(255,255,255,0.1); border-color: var(--blue); }
        .shop-item.disabled { opacity: 0.4; cursor: not-allowed; }
        .item-name { font-weight: bold; font-size: 1.2rem; display: block; }
        .item-cost { color: var(--gold); }

        /* --- Background Animation --- */
        #canvas-stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }
    </style>
</head>
<body>

    <canvas id="canvas-stars"></canvas>

    <div id="selection-overlay">
        <h1 style="color: var(--gold); margin-bottom: 30px;">IDENTITY AUTHENTICATION</h1>
        <button class="user-btn" onclick="login('Derrick')">DERRICK</button>
        <button class="user-btn" onclick="login('Grace')">GRACE</button>
    </div>

    <div id="game-layout">
        <!-- Sidebar: Stats & Logs -->
        <div class="panel">
            <h3>LOGS</h3>
            <div id="manual-log" class="log-text">Last Click: --</div>
            <div id="upgrade-log" class="log-text">Last Upgrade: --</div>
            <hr style="opacity: 0.1">
            <h3>PRODUCTION</h3>
            <div class="log-text">Total CPS: <span id="total-cps" class="highlight">0</span></div>
            <div class="log-text">Click Power: <span id="click-power" class="highlight">1</span></div>
            <hr style="opacity: 0.1">
            <div id="inventory"></div>
        </div>

        <!-- Center: The Button -->
        <div class="center-panel">
            <div id="current-user-display" style="position:absolute; top:20px; color: var(--gold)">COMMANDER: --</div>
            <h2 id="star-display" class="stars-count">0 STARS</h2>
            <button id="star-button"></button>
            <p>CLICK TO HARVEST THE COSMOS</p>
        </div>

        <!-- Right: Shop -->
        <div class="panel">
            <h3>STAR SHOP</h3>
            <div id="shop-container">
                <!-- Shop items will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yuymttkhmphzfesfsgna.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1eW10dGtobXBoemZlc2ZzZ25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3Nzg2MzcsImV4cCI6MjA4NDM1NDYzN30.zwvcoB9-t-UbNgmWkWQsgEc9gDbnnG4Kgi7tmK5HX60';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = "";
        let localState = { stars: 0, click_power: 1, star_dust:0, comets:0, nebulae:0, supernovas:0 };

        const SHOP_ITEMS = [
            { id: 'star_dust', name: 'Star Dust', cost: 15, cps: 0.5, desc: 'Increases automated harvest.' },
            { id: 'comets', name: 'Comet Probe', cost: 100, cps: 4, desc: 'Captures passing comets.' },
            { id: 'nebulae', name: 'Nebula Farm', cost: 1100, cps: 18, desc: 'Extracts gas from nebulae.' },
            { id: 'supernovas', name: 'Supernova Core', cost: 12000, cps: 50, desc: 'Maximum energy output.' }
        ];

        async function login(name) {
            currentUser = name;
            document.getElementById('selection-overlay').style.display = 'none';
            document.getElementById('game-layout').style.display = 'grid';
            document.getElementById('current-user-display').innerText = `COMMANDER: ${currentUser.toUpperCase()}`;
            
            // Initial fetch and start sync
            await syncFromDB();
            setInterval(syncFromDB, 2000); // UI Sync
            setInterval(processAutoClick, 1000); // CPS Loop
        }

        async function syncFromDB() {
            const { data } = await supabase.from('game_state').select('*').eq('id', 1).single();
            if (data) {
                localState = data;
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('star-display').innerText = `${Math.floor(localState.stars).toLocaleString()} STARS`;
            
            // Update Logs
            const clickTime = localState.last_click_at ? new Date(localState.last_click_at).toLocaleTimeString() : 'Never';
            document.getElementById('manual-log').innerHTML = `Last manual click <span class="highlight">${localState.last_click_by}</span> at ${clickTime}`;
            
            if(localState.last_upgrade_name !== 'None') {
                document.getElementById('upgrade-log').innerHTML = `Last upgrade <span class="highlight">${localState.last_upgrade_name}</span> by <span class="highlight">${localState.last_upgrade_by}</span>`;
            }

            // Update CPS & Power
            let cps = 0;
            SHOP_ITEMS.forEach(item => cps += (localState[item.id] * item.cps));
            document.getElementById('total-cps').innerText = cps.toFixed(1);
            document.getElementById('click-power').innerText = localState.click_power;

            // Render Shop
            const shopContainer = document.getElementById('shop-container');
            shopContainer.innerHTML = '';
            SHOP_ITEMS.forEach(item => {
                const count = localState[item.id] || 0;
                const cost = Math.floor(item.cost * Math.pow(1.15, count));
                const canAfford = localState.stars >= cost;
                
                shopContainer.innerHTML += `
                    <div class="shop-item ${canAfford ? '' : 'disabled'}" onclick="buyUpgrade('${item.id}', ${cost}, '${item.name}')">
                        <span class="item-name">${item.name} (${count})</span>
                        <span class="log-text">${item.desc}</span><br>
                        <span class="item-cost">Cost: ${cost} Stars</span>
                    </div>
                `;
            });

            // Update Inventory
            document.getElementById('inventory').innerHTML = `
                <div class="log-text">Star Dust: ${localState.star_dust}</div>
                <div class="log-text">Comets: ${localState.comets}</div>
                <div class="log-text">Nebulae: ${localState.nebulae}</div>
                <div class="log-text">Supernovas: ${localState.supernovas}</div>
            `;
        }

        async function handleManualClick() {
            const newStars = parseFloat(localState.stars) + localState.click_power;
            
            // Logic: Increase click power every 100 manual clicks indirectly or just keep it static
            const { error } = await supabase.from('game_state').update({
                stars: newStars,
                last_click_by: currentUser,
                last_click_at: new Date().toISOString()
            }).eq('id', 1);

            if(!error) { localState.stars = newStars; updateUI(); }
        }

        async function buyUpgrade(id, cost, name) {
            if (localState.stars < cost) return;

            const updates = {
                stars: localState.stars - cost,
                [id]: localState[id] + 1,
                last_upgrade_by: currentUser,
                last_upgrade_name: name,
                last_upgrade_at: new Date().toISOString()
            };

            const { error } = await supabase.from('game_state').update(updates).eq('id', 1);
            if(!error) syncFromDB();
        }

        async function processAutoClick() {
            let cps = 0;
            SHOP_ITEMS.forEach(item => cps += (localState[item.id] * item.cps));
            
            if (cps > 0) {
                const newStars = parseFloat(localState.stars) + cps;
                // We update the DB for the shared state
                await supabase.from('game_state').update({ stars: newStars }).eq('id', 1);
            }
        }

        document.getElementById('star-button').addEventListener('click', handleManualClick);

        // Background Animation
        const canvas = document.getElementById('canvas-stars');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<200; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
                s.y += s.speed;
                if(s.y > canvas.height) s.y = 0;
            });
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', initStars);
        initStars();
        animateStars();

    </script>
</body>
</html>
